name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff integration test needs full history + tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies
        run: uv audit --frozen
        continue-on-error: true

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test affected backend clock drift
        run: |
          targets=(
            "tests/integration/core/api/test_focus_preview_capacity.py::test_scheduled_publication_defers_under_real_scheduler_saturation_then_reacquires_backend"
            "tests/integration/core/api/test_focus_preview.py::test_real_startup_cleans_staging_and_fails_strictly_older_pending_rows"
            "tests/integration/core/api/test_focus_preview.py::test_transient_startup_recovery_failure_blocks_then_later_route_retries"
            "tests/integration/core/api/test_focus_preview.py::test_real_lifespan_isolates_recovery_for_distinct_sqlite_backends_with_shared_provider_id"
            "tests/integration/core/api/test_focus_preview_allocation_lineage.py::test_real_production_lineage_projects_multiple_origins_actual_portions_and_frozen_separate_tags"
            "tests/integration/core/api/test_focus_preview_historical_repair_upgrade.py::test_v210_retained_month_fails_then_production_rest_repair_enables_daily_and_monthly_preview"
            "tests/integration/core/api/test_focus_preview_monthly_cutoff_v5.py::test_settled_monthly_positive_sources_use_real_calculate_lineage_and_persist_exact_package"
            "tests/integration/core/api/test_focus_preview_pipeline.py::test_same_key_tiers_flow_from_provider_capture_through_sidecar_and_canonical_daily_monthly_api"
            "tests/integration/core/api/test_focus_preview_pipeline.py::test_real_calculate_unknown_allocator_publishes_daily_and_monthly_known_plus_fallback"
            "tests/integration/core/api/test_focus_preview_pipeline.py::test_real_bundle_known_native_lines_retain_current_mapping_and_context_behavior"
            "tests/integration/core/api/test_focus_preview_pipeline.py::test_production_lineage_integrity_error_logs_safe_owner_context_and_persists_unavailable_fallback"
            "tests/integration/test_pipeline_integration.py::TestEndToEndPipeline::test_full_gather_calculate"
          )
          for anchor in "2035-06-15T12:00:00+00:00" "2035-01-01T00:00:00+00:00"; do
            PYTHONPATH=. timeout 600s uv run pytest \
              -p tests.clock_drift \
              --clock-drift-now "$anchor" \
              -q --tb=short \
              "${targets[@]}"
          done

      - name: Test with coverage
        run: uv run pytest --cov=src --cov-fail-under=75 --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test

      - name: Build
        run: npm run build

  postgresql-migration:
    name: PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chitragupta_test
          POSTGRES_USER: chitragupta
          POSTGRES_PASSWORD: chitragupta  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chitragupta -d chitragupta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PostgreSQL migration tests
        env:
          TEST_POSTGRESQL_URL: postgresql+psycopg://chitragupta:chitragupta@localhost:5432/chitragupta_test  # pragma: allowlist secret
        run: >-
          uv run pytest
          tests/integration/core/storage/test_migration_029_postgresql.py
          tests/integration/core/storage/test_manual_alembic_command.py
          tests/integration/plugins/self_managed_kafka/storage/test_schema_postgresql.py

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality, frontend, postgresql-migration]
    if: always()
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || "${{ needs.frontend.result }}" != "success" || "${{ needs.postgresql-migration.result }}" != "success" ]]; then
            echo "CI failed — quality=${{ needs.quality.result }}, frontend=${{ needs.frontend.result }}, postgresql-migration=${{ needs.postgresql-migration.result }}"
            exit 1
          fi
          echo "All CI jobs succeeded"
