x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_NUM_PARTITIONS: "1"
  KAFKA_LOG_RETENTION_MS: "1800000"
  KAFKA_LOG_RETENTION_BYTES: "33554432"
  KAFKA_LOG_SEGMENT_BYTES: "8388608"
  KAFKA_LOG_CLEANUP_POLICY: delete
  KAFKA_JMX_PORT: "9999"
  KAFKA_OPTS: -Djava.security.auth.login.config=/opt/kafka/config/lab/server-jaas.conf
  KAFKA_JMX_OPTS: >-
    -Dcom.sun.management.jmxremote=true
    -Dcom.sun.management.jmxremote.authenticate=false
    -Dcom.sun.management.jmxremote.ssl=false
    -Dcom.sun.management.jmxremote.rmi.port=9999

services:
  kafka-a:
    image: apache/kafka:4.3.1
    hostname: kafka-a
    environment:
      <<: *kafka-environment
      CLUSTER_ID: ${KAFKA_CLUSTER_A_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-a:9093
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka-a:9092
      KAFKA_JMX_HOSTNAME: kafka-a
    volumes:
      - ./generated/server-a-jaas.conf:/opt/kafka/config/lab/server-jaas.conf:ro
      - ./generated/admin-a.properties:/opt/kafka/config/lab/admin.properties:ro
    tmpfs:
      - /tmp/kraft-combined-logs:size=512m,mode=0770,uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-a:9092 --command-config /opt/kafka/config/lab/admin.properties >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *bounded-logging

  kafka-b:
    image: apache/kafka:4.3.1
    hostname: kafka-b
    environment:
      <<: *kafka-environment
      CLUSTER_ID: ${KAFKA_CLUSTER_B_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-b:9093
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka-b:9092
      KAFKA_JMX_HOSTNAME: kafka-b
    volumes:
      - ./generated/server-b-jaas.conf:/opt/kafka/config/lab/server-jaas.conf:ro
      - ./generated/admin-b.properties:/opt/kafka/config/lab/admin.properties:ro
    tmpfs:
      - /tmp/kraft-combined-logs:size=512m,mode=0770,uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-b:9092 --command-config /opt/kafka/config/lab/admin.properties >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *bounded-logging

  jmx-a:
    build:
      context: ./jmx
      dockerfile: Dockerfile
      args:
        JMX_EXPORTER_VERSION: 1.5.0
    command: ["/etc/jmx-exporter/config.yml"]
    depends_on:
      kafka-a:
        condition: service_healthy
    volumes:
      - ./generated/jmx-a.yml:/etc/jmx-exporter/config.yml:ro
    ports:
      - 127.0.0.1:${JMX_EXPORTER_A_PORT:-7071}:7071
    logging: *bounded-logging

  jmx-b:
    build:
      context: ./jmx
      dockerfile: Dockerfile
      args:
        JMX_EXPORTER_VERSION: 1.5.0
    command: ["/etc/jmx-exporter/config.yml"]
    depends_on:
      kafka-b:
        condition: service_healthy
    volumes:
      - ./generated/jmx-b.yml:/etc/jmx-exporter/config.yml:ro
    ports:
      - 127.0.0.1:${JMX_EXPORTER_B_PORT:-7072}:7071
    logging: *bounded-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    depends_on:
      - jmx-a
      - jmx-b
    volumes:
      - ./generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:size=1536m,mode=0770,uid=65534,gid=65534
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    logging: *bounded-logging

  kafka-setup:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-a:
        condition: service_healthy
      kafka-b:
        condition: service_healthy
    entrypoint: ["bash", "/opt/lab/scripts/setup_kafka.sh"]
    volumes:
      - ./scripts:/opt/lab/scripts:ro
      - ./generated:/opt/lab/generated:ro
    logging: *bounded-logging

  workload-a:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-a:
        condition: service_healthy
    entrypoint: ["bash", "/opt/lab/scripts/workload.sh", "cluster-a", "kafka-a:9092", "/opt/lab/generated"]
    volumes:
      - ./scripts:/opt/lab/scripts:ro
      - ./generated:/opt/lab/generated:ro
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *bounded-logging

  workload-b:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-b:
        condition: service_healthy
    entrypoint: ["bash", "/opt/lab/scripts/workload.sh", "cluster-b", "kafka-b:9092", "/opt/lab/generated"]
    volumes:
      - ./scripts:/opt/lab/scripts:ro
      - ./generated:/opt/lab/generated:ro
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *bounded-logging

  jmx-dump-a:
    image: eclipse-temurin:21-jdk
    depends_on:
      kafka-a:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - javac -d /tmp /opt/lab/scripts/JmxDump.java && exec java -cp /tmp JmxDump kafka-a 9999
    volumes:
      - ./scripts:/opt/lab/scripts:ro
    logging: *bounded-logging

  jmx-dump-b:
    image: eclipse-temurin:21-jdk
    depends_on:
      kafka-b:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - javac -d /tmp /opt/lab/scripts/JmxDump.java && exec java -cp /tmp JmxDump kafka-b 9999
    volumes:
      - ./scripts:/opt/lab/scripts:ro
    logging: *bounded-logging
